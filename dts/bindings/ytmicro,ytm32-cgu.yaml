description: YTMicro YTM32 Clock Generation Unit (CGU)

compatible: "ytmicro,ytm32-cgu"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 1

  firc-frequency:
    type: int
    required: false
    description: |
      Fast Internal RC Oscillator frequency in Hz.
      This is a hardware-fixed value set in the SoC DTSI — do not override
      in board DTS.  The driver uses BUILD_ASSERT to cross-check this against
      the YTM32_FIRC_HZ constant in the SoC clock header.
        YTM32B1MD1: 96 000 000 (RM §12.1 / FEATURE_SCU_FIRC_FREQ)
        YTM32B1MC0: 80 000 000

  sirc-frequency:
    type: int
    required: false
    description: |
      Slow Internal RC Oscillator frequency in Hz.
      Hardware-fixed; set in the SoC DTSI, do not override in board DTS.
        YTM32B1MD1 / MC0: 12 000 000 (RM §12.1 / FEATURE_SCU_SIRC_FREQ)

  system-clock-source:
    type: int
    required: false
    default: 0
    description: |
      System clock source selector.  Use YTM32_SYSTEM_CLOCK_SRC_* values.
        0 = FIRC   (default after reset)
        1 = FXOSC  (requires fxosc-frequency in board DTS)
        2 = PLL    (requires the pll-* properties below)

  fxosc-frequency:
    type: int
    required: false
    description: |
      External fast oscillator (crystal) frequency in Hz.
      Required when system-clock-source is FXOSC or PLL sourced from FXOSC.
      Valid range per RM §12.1: 4 000 000 – 40 000 000 Hz.
      The driver enforces this range with BUILD_ASSERT at compile time.
      Set this in the board DTS to match the actual crystal (e.g. X2 on the
      Xiaomi CyberGear board is 16 MHz).

  fxosc-bypass:
    type: boolean
    description: |
      Enable FXOSC bypass mode for an externally driven clock input (no
      crystal resonator).  When set, fxosc-frequency must equal the
      external clock source frequency.

  fxosc-gain-selection:
    type: int
    required: false
    default: 6
    description: |
      FXOSC gain selection value passed to the vendor SCU configuration.

  pll-reference-clock:
    type: int
    required: false
    default: 0
    description: |
      PLL reference clock source, used only when system-clock-source is PLL.
      Use YTM32_PLL_REF_* values (scu_pll_ref_clk_t):
        0 = FXOSC  (requires fxosc-frequency; the usual crystal-accurate path)
        1 = FIRC
      The PLL input frequency finput = <reference-freq> / pll-reference-divider
      must stay within 8–40 MHz (RM §12.1; host tool clock.ts enforces 8–48 MHz).

  pll-feedback-divider:
    type: int
    required: false
    description: |
      PLL feedback divider (Ndiv / FBDIV), used only when system-clock-source
      is PLL.  Valid range 10–63 (host tool clock.ts).  The PLL output is:
        pll-out = (<reference-freq> / pll-reference-divider) * pll-feedback-divider / 2
      and must land in 100–200 MHz.  The driver enforces all of these with
      BUILD_ASSERT at compile time.

  pll-reference-divider:
    type: int
    required: false
    default: 1
    description: |
      PLL reference (pre-)divider (Npre / REFDIV), used only when
      system-clock-source is PLL.  Valid range 1 or 3–16 (value 2 is not
      supported by the hardware, per host tool clock.ts).

  core-clock:
    type: int
    required: true
    description: |
      Core (CPU / SysTick) clock frequency in Hz after all dividers.
      Derived value: core-clock = <source-freq> / core-divider, where
      <source-freq> is FIRC, FXOSC, or the PLL output depending on
      system-clock-source.
      A BUILD_ASSERT in the clock driver checks this identity at compile
      time to catch copy-paste errors.  CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC
      is auto-derived from this property via Kconfig dt_node_int_prop_int.

  core-divider:
    type: int
    required: true
    description: |
      Integer divider applied to the selected system clock source to produce
      the core clock.  Hardware-supported range: 1–16 (SCU FBDIVS register).

  fast-bus-divider:
    type: int
    required: false
    default: 1
    description: |
      Divider for the fast bus clock relative to the selected system clock.
      MVP-3 keeps the FIRC profile fixed and currently supports fast bus
      divider 1 only.

  slow-bus-divider:
    type: int
    required: false
    description: |
      Divider for the slow bus clock relative to the selected system clock.
      This is the preferred property for YTM32 SCU bus clock description.

  bus-divider:
    type: int
    required: false
    deprecated: true
    description: |
      Legacy alias for `slow-bus-divider`.
      Keep this only for transition from the early single-bus model.

clock-cells:
  - id
