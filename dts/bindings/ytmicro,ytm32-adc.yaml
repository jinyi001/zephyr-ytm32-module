description: YTMicro YTM32 ADC controller

compatible: "ytmicro,ytm32-adc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    type: phandle-array
    required: true
    description: ADC peripheral clock specifier from the CGU.

  ytmicro,functional-clock-source:
    type: int
    required: true
    description: Functional clock source passed to the YTM32 clock controller.

  ytmicro,functional-clock-divider:
    type: int
    required: false
    default: 3
    description: |
      ADC clock divider register value. Actual divisor = value + 1.
      Default 3 means divide-by-4 (16 MHz FXOSC -> 4 MHz ADC clock).

  dmas:
    type: phandle-array
    required: false
    description: |
      DMA channel for draining the ADC FIFO in hardware-triggered mode.
      Provide one entry: <&dma0 channel slot>.

  dma-names:
    type: string-array
    required: false
    description: Must be "rx" when dmas is present.

  ytmicro,hw-trigger-source:
    type: int
    required: false
    description: |
      TMU trigger source index routed to ADC0_EXT_TRIG.
      Example: YTM32_TMU_SRC_ETMR0_INIT_TRIG (22).
      When absent, only software-triggered mode is available.

  ytmicro,tmu:
    type: phandle
    required: false
    description: |
      TMU device used to route ytmicro,hw-trigger-source to the ADC external
      trigger input when hardware-triggered DMA sampling is started.
      Required together with ytmicro,hw-trigger-source for Phase 2 DMA mode.

  ytmicro,cim-trigger-select:
    type: int
    required: false
    default: 2
    description: |
      CIM ADC0_TRIG_SEL field value selecting the hardware trigger source.
      Values (YTM32B1MD1 SVD, CIM_CTRL register):
        0 = PTU output
        1 = TMU output synchronised by bus clock
        2 = TMU output synchronised by ADC functional clock (recommended, default)
      Bus-clock sync (1) can drop the trigger edge on MD1 when the ADC
      functional clock is slow relative to the bus clock.

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
